[pytest]
# The "live" tier reads the REAL /proc (own-pid invariants only, no psutil). It
# is opt-in: deselected by default so the fixture-only suite stays hermetic and
# CI-safe. Run it explicitly with:  python3 -m pytest -m live
addopts = -m "not live"
markers =
    live: tests that read the real /proc on this machine (opt-in; excluded by default)
